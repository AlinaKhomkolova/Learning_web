version: "3.8"


networks:
  default:
    name: my_django_network

services:
  nginx:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    depends_on:
      - web
    networks:
      - my_django_network

  web:
    build: .
    command: bash -c "sleep 10 && python3 manage.py migrate"
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - my_django_network

  db:
    image: postgres:16.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    networks:
      - my_django_network

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    networks:
      - my_django_network
